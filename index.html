<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Язык R — вход</title><link rel="stylesheet" href="login.css"></head><body><header class="topbar"><span class="brand-mark">R</span>Материалы курса</header><main><section class="login-card" aria-labelledby="login-title"><img class="course-logo" src="au/assets/images/course-logo.png" alt="Логотип курса «Язык R»"><p class="eyebrow">Язык R</p><h1 id="login-title">Добро пожаловать</h1><p class="intro">Лекции, практики и задания — в одном месте. Введите пароль вашей группы, чтобы открыть материалы.</p>
<form id="login"><label for="password">Пароль доступа</label><input id="password" type="password" required autocomplete="current-password" autofocus placeholder="Введите пароль" aria-describedby="message"><button type="submit">Открыть курс <span aria-hidden="true">→</span></button><p id="message" role="status"></p></form><p class="hint">Пароль выдаёт преподаватель. Если у вас его пока нет, обратитесь к нему.</p>
<script src="login-crypto.js"></script><script>
const entries = [{"salt":"11111111111111111111111111111111","encrypted":"19b7d09c8710afd4a10d8f2c74f8d7c313cfce42a1b914bfdc4dac558e343a806342472cbf2e3d76b56e7f0e409bf39518b6291c995a96ff0aba3ef6ffbd808c"},{"salt":"22222222222222222222222222222222","encrypted":"85bca300202a472134585450fc2a9939e1c2897cc1cb73221a73e5ef4f3e8e56e36c771423053da56bd0ea38bd45b34edd3a3aef731bdfeb39da0326c4e088d5"}];
const form = document.getElementById('login');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = form.querySelector('button');
  const message = document.getElementById('message');
  button.disabled = true;
  message.textContent = 'Проверяем пароль…';
  try {
    const password = document.getElementById('password').value;
    for (const entry of entries) {
      const hash = await cryptoEngine.hashPassword(password, entry.salt);
      const result = await codec.init(cryptoEngine).decode(entry.encrypted, hash, entry.salt);
      if (result.success) {
        localStorage.setItem('staticrypt_passphrase', hash);
        localStorage.setItem('staticrypt_expiration', String(Date.now() + 86400000));
        location.assign(result.decoded);
        return;
      }
    }
    message.textContent = 'Неверный пароль. Попробуйте ещё раз.';
  } catch (error) {
    message.textContent = 'Не удалось выполнить вход. Откройте сайт через HTTPS или localhost и разрешите хранение данных сайта.';
  } finally { button.disabled = false; }
});
</script></section></main><footer>Курс по языку R</footer></body></html>
